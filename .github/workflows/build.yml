name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use one fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          if [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore ~/.android/debug.keystore
            echo "Using the saved signing key"
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p signing
            cp ~/.android/debug.keystore signing/debug.keystore
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add signing/debug.keystore
            git commit -m "Save app signing key"
            git push
            echo "Created and saved a new signing key"
          fi
      - name: Build the app
        run: |
          pip install pillow
          mkdir -p www
          cp app-index.html www/index.html
          sed -i "s/__APP_BUILD__/${{ github.run_number }}/" www/index.html
          npm install
          npx cap add android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          sed -i 's/networkTimeout=.*/networkTimeout=180000/' android/gradle/wrapper/gradle-wrapper.properties
          ok=0
          for U in https://services.gradle.org/distributions/gradle-8.2.1-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip; do
            for t in 1 2 3; do
              echo "Downloading Gradle from $U (try $t)"
              if curl -fsSL --max-time 150 -o /tmp/g.zip "$U" && unzip -tq /tmp/g.zip >/dev/null 2>&1; then ok=1; break 2; fi
              sleep 10
            done
          done
          if [ "$ok" = "1" ]; then
            echo "Gradle downloaded, using the local copy"
            sed -i "s#^distributionUrl=.*#distributionUrl=file:///tmp/g.zip#" android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "Could not download Gradle from any source"
            exit 1
          fi
          cat android/gradle/wrapper/gradle-wrapper.properties
          python make_assets.py
          npx cap sync android
          cd android
          chmod +x gradlew
          for i in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && break; echo "Attempt $i failed, trying again in 20 seconds"; sleep 20; done
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Exam-Arc.apk
      - name: Show which key signed the app
        run: |
          echo "=== SAVED KEY (signing/debug.keystore) ==="
          keytool -list -keystore signing/debug.keystore -storepass android 2>&1 | grep -i "fingerprint" || true
          echo "=== KEY THAT SIGNED Exam-Arc.apk ==="
          keytool -printcert -jarfile Exam-Arc.apk 2>&1 | grep -i "SHA256" || true
          echo "=== APP VERSION ==="
          "$(ls -d $ANDROID_HOME/build-tools/* | tail -1)/aapt" dump badging Exam-Arc.apk 2>&1 | head -1 || true
      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app Exam-Arc.apk --title "Exam-Arc app" --notes "Latest Android app: build ${{ github.run_number }}. Download Exam-Arc.apk"
